name: THE DESCENT regression tests
on:
  push:
    branches:
      - v3-3-endings
      - v3-4-global-causality
      - main
      - v3-5-system-overhaul
      - v3-6-causal-pressure-repair
      - v3-4-author-afterword
  workflow_dispatch:
jobs:
  game-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt 'httpx>=0.27,<1.0'
      - run: python -m compileall -q game_engine.py dramatic_v35.py causal_core.py horror_endings.py ai_web.py app.py
      - run: node --check static/client.js
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
