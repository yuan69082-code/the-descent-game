name: THE DESCENT regression tests
on:
  push:
    branches:
      - v3-3-endings
      - v3-4-global-causality
      - main
      - v3-4-author-afterword
  workflow_dispatch:
jobs:
  game-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
